name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Postgres real en el propio runner: los tests de aceptación dependen de
    # `EXCLUDE`, triggers, `REVOKE` y advisory locks, así que no sirve un doble.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: convenios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/convenios_test
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/convenios_test
      SESSION_COOKIE_NAME: convenios_sesion

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Migrar el esquema
        run: npm run db:migrate

      - name: Sembrar dataset determinista para E2E
        run: npm run db:seed
        env:
          # Credencial efímera del Postgres de Actions; el seed queda sin
          # cambio forzado de contraseña y las rutas pueden autenticarse.
          SEED_PASSWORD: Temporal123

      - name: Typecheck, lint, formato y tests unitarios
        run: npm run check

      - name: Tests de aceptación contra Postgres
        run: npm test
        env:
          RUN_DB_TESTS: "1"

      - name: Build de producción
        run: npm run build

      - name: Presupuesto de JavaScript gzip
        run: npm run perf:budget

      - name: Instalar Chromium para contratos de UI
        run: npx playwright install --with-deps chromium

      - name: Contrato móvil, PWA y no regresión desktop
        run: npm run test:e2e:qa
        env:
          E2E_QA_SUPERADMIN_USER: admin
          E2E_QA_ADMIN_USER: sc.admin
          E2E_QA_VENDEDOR_USER: sc.vende1
          E2E_QA_PASSWORD: Temporal123

      - name: Publicar evidencia de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-qa
          path: artifacts/playwright
          if-no-files-found: warn

      - name: Publicar reporte de bundles por ruta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-rutas
          path: artifacts/bundle/reporte-rutas.json
          if-no-files-found: warn
